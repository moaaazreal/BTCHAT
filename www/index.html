<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>Reality BT Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Bar: Status & Scan -->
        <header class="top-bar">
            <h2>Reality BT Chat</h2>
            <div id="connection-status" class="status disconnected">Disconnected</div>
            <button id="scan-btn">Scan Devices</button>
        </header>

        <!-- Device Selection Modal / List -->
        <div id="device-list-container" class="panel">
            <h3>Paired / Nearby Devices</h3>
            <ul id="device-list">
                <li>Click 'Scan Devices' to find connections</li>
            </ul>
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-area">
            <div class="message received">
                <span class="text">Welcome to Reality BT Chat! Connect a device to start.</span>
            </div>
        </div>

        <!-- File Transfer Progress -->
        <div id="progress-container" class="hidden">
            <span id="progress-text">Sending file... 0%</span>
            <progress id="file-progress" value="0" max="100"></progress>
        </div>

        <!-- Bottom Bar: Input & Send -->
        <footer class="bottom-bar">
            <input type="file" id="file-input" style="display: none;">
            <button id="attach-btn" title="Send File">📎</button>
            <input type="text" id="message-input" placeholder="Type a secure message...">
            <button id="send-btn">Send</button>
        </footer>
    </div>

    <!-- Vault / In-App Viewer Modal -->
    <div id="vault-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Secure Vault Viewer</h3>
            <div id="vault-files-list"></div>
            <button id="close-vault">Close Vault</button>
        </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="app.js"></script>
</body>
</html>
